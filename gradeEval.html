<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Sample Grade Evaluation</title>
</head>
<h4>
    <h1>Grade Evaluation Calculator</h1>

<!-- Enter Course and Instructor Details -->
    <h4>Course Details</h4>
    <input id="courseName" placeholder="Please Enter Course Name">
    <!-- <input id="courseNumber" placeholder="Please Enter Course Number"> -->


    <h4>Course Instructor</h4>
    <input id="instructorName" placeholder="Please Enter Course Instructor">

    <!-- Enter Grades -->
    <h3>Upload Assignment Grades</h3>
    <input id="grade1" placeholder="Please enter grade" type="number">
    <input id="grade2" placeholder="Please enter grade" type="number">
    
    <!-- Calculate Grade Average -->
    <br><br><br>
    <h4>Grade Average</h4>
    <input id="gradeOutput" type="number">
    <input type="button" id="calculateGrade" value="Calculate">

    <!-- Script Reference -->
    <script src="gradeEval.js"></script>
</body>
</html>
