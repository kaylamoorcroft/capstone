<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/ededc88243.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="sass/styles.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <title>Course Map</title>
</head>
<body id="profile-page">
<!-- <a href="index.html" class="btn btn-primary">Back</a> -->
    <div class="container" style="margin: 0;">
        <nav class="navbar navbar-expand-lg my-2">
            <a id="logo" class="navbar-brand" href="index.html">
                <img src="images/logo.png" width="60" height="50">
            </a>
        </nav>
    </div>

    <main class="form_border container" style="width: 65%; margin-inline: auto; background-color: white;">
        <h2 style="text-align: center; padding-bottom: 1em;">User Profile</h2>

        <div id="profile" class="container">
            <div>
                <h5>Degree Level</h5>
                <span id="degree-level"></span>
            </div>
            <div>
                <h5>Postgraduate Option</h5>
                    <span id="postgrad-option"></span>
            </div>
            <div>
                <h5>Year of Study</h5>
                    <span id="comp-year"></span>
            </div>
            <div>
                <h5>First Year Course Preference</h5>
                    <span id="first-year-pref"></span>
            </div>
            <div>
                <h5>Start Date</h5>
                    <span id="start-date"></span>
            </div>
            <div>
                <h5>Degree Type</h5>
                    <span id="comp-type"></span>
            </div>
            <div>
                <h5>Enrollment Status</h5>
                    <span id="student-type"></span>
            </div>
        </div>
        <div id="link-button"><a href="intake-survey.html">Edit Survey Responses</a></div>
    </main>

<script src="js/pages/profile.js"></script>
</body>
</html>
