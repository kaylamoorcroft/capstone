<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/ededc88243.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <title>Course Map</title>
</head>
<body>
<a href="index.html" class="btn btn-primary">Back</a>

<div class="form_border container" style="width: 70%;">
    <h3 style="text-align: center">User Profile</h3>

    <div class="row profile_div">
        <div class="col-md-6">
            <h6>Degree Level</h6>
            <span></span>
        </div>
        <div class="col-md-6">
            <h6>Postgraduate Option</h6>
            <span></span>
        </div>
    </div>

    <div class="row profile_div">
        <div class="col-md-6">
            <h6>Year of Study</h6>
            <span></span>
        </div>
        <div class="col-md-6">
            <h6>First Year Course Preference</h6>
            <span></span>
        </div>
    </div>

    <div class="row profile_div">
        <div class="col-md-6">
            <h6>Start Date</h6>
            <span></span>
        </div>
        <div class="col-md-6">
            <h6>Degree Type</h6>
            <span></span>
        </div>
    </div>
    
    <div>
        <h6>Enrollment Status</h6>
        <span></span>
    </div>

    <p id="display-area"> </p>
</div>


    <button id="display-button" type="button" class="btn btn-outline-primary" style="margin-left: 20px">Load Saved Data</button>
    

<script src="js/profile.js"></script>
</body>
</html>
