<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="images/logo.png" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <title>Course Map</title>
</head>
<body id="survey-page" style="background-color: rgb(219, 237, 242)">
    <div class="container" style="margin: 0;">
        <nav id="home-navbar" class="navbar navbar-expand-lg my-2">
            <a id="logo" class="navbar-brand" href="index.html">
                <img src="images/logo.png" width="60" height="50">
            </a>
        </nav>
    </div>

    <main class="intake-survey" style="background-color: white;">
        <h1>Welcome to C-Map!</h1>

        <form id="survey">
            <div class="form-group">
                <label for="degree-level">Are you an Undergraduate or Postgraduate student?</label>
                <select name="degree-level" id="degree-level" class="form-control" required>
                    <option value="">--Select an option--</option>
                    <option value="undergrad">Undergraduate Student</option>
                    <option value="postgrad">Postgraduate Student</option>
                </select>
            </div>
            <div id="postgrad-group" class="form-group d-none span-across">
                <label for="postgrad-option">Select a Postgraduate Degree:</label>
                <select name="postgrad-option" id="postgrad-option" class="form-control">
                    <option value="">--Select an option--</option>
                    <option value="masters">Masters Degree</option>
                    <option value="doctoral">Doctoral Degree</option>
                </select>
            </div>
            <div class="form-group">
                <label for="comp-year">Which year are you in?</label>
                <select name="comp-year" id="comp-year" class="form-control" required>
                    <option value="">--Select an option--</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5+">5+</option>
                </select>
            </div>
            <div id="first-year-group" class="form-group d-none span-across">
                <label for="first-year-pref">Choose a first year course preference:</label>
                <select name="first-year-pref" id="first-year-pref" class="form-control">
                    <option value="">--Select an option--</option>
                    <option value="comp-programming">Computer Programming 1 and 2</option>
                    <option value="intro-cs">Intro to Computer Science</option>
                </select>
            </div>
            <div class="form-group span-across">
                <label for="start-semester">When did you begin at Acadia?</label>
                <select name="start-semester" id="start-semester" class="form-control">
                    <option value="">--Select an option--</option>
                    <option value="fall">Fall</option>
                    <option value="winter">Winter</option>
                </select>
                <select name="start-year" id="start-year" class="form-control">
                    <option value="">--Select an option--</option>
                    <option value="2020">2020</option>
                    <option value="2021">2021</option>
                    <option value="2022">2022</option>
                    <option value="2023">2023</option>
                    <option value="2024">2024</option>
                    <option value="2025">2025</option>
                    <option value="2026">2026</option>
                    <option value="2027">2027</option>
                </select>
            </div>
            <div class="form-group">
                <label for="comp-type">Which stream of Computer Science are you taking?</label>
                <select name="comp-type" id="comp-type" class="form-control" required>
                    <option value="">--Select an option--</option>
                    <option value="BCS">BCS</option>
                    <option value="BCS with Honours">BCS with Honours</option>
                    <option value="BACS">BACS</option>
                </select>
            </div>
            <div id="applied-option-group" class="form-group d-none span-across">
                <label for="applied-option">Select a specialization for Applied Computer Science:</label>
                <select name="applied-option" id="applied-option" class="form-control">
                    <option value="">--Select an option--</option>
                    <option value="muc">BACS with Mobile and Ubiquitous Computing Option</option>
                    <option value="game-dev">BACS with Game Development Defined Option</option>
                    <option value="software-dev">BACS with Software Development Defined Option</option>
                    <option value="data-analytics">Data Analytics Option (Special Program)</option>
                    <option value="interdisciplinary-studies">BACS with Interdisciplinary Study</option>
                </select>
            </div>
            <div class="form-group">
                <label for="student-type">Are you a Full-Time or Part-Time Student?</label>
                <select name="student-type" id="student-type" class="form-control" required>
                    <option value="">--Select an option--</option>
                    <option value="full-time">Full-Time</option>
                    <option value="part-time">Part-Time</option>
                </select>
            </div>
            <!-- automatically recognize "button" element as submit when inside form tag -->
            <button class="span-across">Submit</button>
        </form>
    </main>
    <script src="js/pages/survey.js"></script>
</body>
</html>
